name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @jw-notes-sync/core build

      - name: Test core
        run: pnpm --filter @jw-notes-sync/core test

      - name: Check web (typecheck)
        run: pnpm --filter @jw-notes-sync/web check

      - name: Build web
        run: pnpm --filter @jw-notes-sync/web build
